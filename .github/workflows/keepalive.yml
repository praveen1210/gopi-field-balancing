# A free Supabase project pauses after a week without activity. This pings
# public.health_check twice a week. Needs repository secrets SUPABASE_URL and
# SUPABASE_ANON_KEY (the public project URL and publishable key); skipped until set.
name: Supabase keep-alive

on:
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "Secrets not set; skipping."; exit 0; fi
          curl -sf -X POST "$SUPABASE_URL/rest/v1/rpc/health_check" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            -H "Content-Type: application/json" -d '{}'
